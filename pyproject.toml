[project]
name = "lawrag"
version = "0.1.0"
description = "Air-gapped RAG over the Constitution and Codes of the Republic of Kazakhstan"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Installed on the connected side, then carried across the air gap as wheels.
models = [
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2",
  "torch>=2.2",
  # Only `lawrag train` needs this; it rides with the weights stack because
  # that is the image with a GPU.
  "datasets>=2.19",
  # `lawrag experiment`: the BM25 baseline (sparse matrices) and the figures.
  "scipy>=1.10",
  "matplotlib>=3.7",
  # `lawrag final-experiment`: grid / randomized search and the learned
  # hybrid (scikit-learn), the QLoRA reranker (peft + bitsandbytes 4-bit).
  "scikit-learn>=1.4",
  "peft>=0.12",
  "bitsandbytes>=0.46",
  "accelerate>=0.30",
]
dev = ["pytest>=8.0"]

[project.scripts]
lawrag = "lawrag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lawrag = ["evalkit/*.yaml", "sql/*.sql", "api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
