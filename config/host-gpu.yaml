# Host-interpreter run with the real embedder on this machine's card.
#
# The same pipeline as config/local.yaml, but dense retrieval runs on the
# fine-tuned bge-m3 (models/bge-m3-lawrag, produced by `lawrag train`) on
# CUDA, against the compose database. No reranker weights on disk and no
# generator: `ask` still abstains with no_model_loaded.
#
# Use it with:  LAWRAG_CONFIG=config/host-gpu.yaml lawrag <command>
#
# After changing the embedder, re-ingest (every chunk is re-embedded) and
# re-run `lawrag calibrate` with a question set for this corpus:
# retrieval.min_dense_score is on the model's own scale.

db:
  # 127.0.0.1, not localhost: compose publishes the port on IPv4 loopback
  # only, and Windows resolves localhost to ::1 first, so every connection
  # would wait out a timeout before falling back to IPv4.
  dsn: postgresql://postgres:2006@127.0.0.1:5433/lawrag

embedding:
  backend: bge-m3
  model_path: models/bge-m3-lawrag
  dim: 1024
  device: cuda
  batch_size: 32

rerank:
  backend: none

llm:
  backend: echo

chunking:
  generate_context_sentences: false

log_level: INFO
