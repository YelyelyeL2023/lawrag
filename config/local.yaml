# Local macOS run: placeholder models, no weights on disk, no CUDA.
#
# config/default.yaml is tuned for the production Windows workstation
# (bge-m3 on CUDA, llama-server, D:/models/...). None of that exists here, so
# this file runs the pipeline on the deterministic hash embedder and the echo
# LLM. Retrieval is fully functional; `ask` abstains with no_model_loaded.
#
# Use it with:  LAWRAG_CONFIG=config/local.yaml lawrag <command>

db:
  dsn: postgresql://postgres:2006@localhost:5433/lawrag

embedding:
  backend: hash
  dim: 1024
  device: cpu

rerank:
  backend: none

llm:
  backend: echo

chunking:
  generate_context_sentences: false

log_level: INFO
