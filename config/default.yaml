# lawrag configuration.
#
# This file is where a setting is reasoned about. Anything that differs between
# one deployment and the next — hostnames, ports, device, where the weights are
# mounted — is set by the environment instead and overrides what is here:
#
#   LAWRAG_<SECTION>_<FIELD>     e.g. LAWRAG_EMBEDDING_DEVICE=cuda
#
# docker-compose.yml sets exactly those wiring variables, which is why the
# paths below are the ones a container sees. Nothing here assumes a host
# interpreter, a virtualenv or a Windows drive letter.
#
# The shipped backends are the production ones. A machine with no weights on
# disk can run the whole pipeline on placeholders instead — embedding.backend:
# hash and llm.backend: echo — and retrieval stays fully functional.

db:
  # `db` is the compose service name; from outside the compose network use
  # localhost and the published port (5433 by default).
  dsn: postgresql://postgres:2006@db:5432/lawrag

embedding:
  backend: bge-m3        # production (was: hash placeholder)
  # MODEL_DIR on the host is mounted at /models in every container.
  model_path: /models/bge-m3
  dim: 1024
  # Overridden by LAWRAG_EMBEDDING_DEVICE: the base compose file says cpu, the
  # GPU overlay says cuda. A config file cannot know whether the machine it is
  # mounted into has a card.
  device: cuda
  batch_size: 8

rerank:
  backend: bge-reranker  # production (was: none)
  model_path: /models/bge-reranker-v2-m3
  device: cpu            # keep the 8 GB card for the generator
  top_k_in: 40
  top_k_out: 8

llm:
  backend: llamacpp      # production (was: echo)
  # `llm` is the compose service (profile "llm"); llama-server listens on 8080
  # inside the network and is published on 127.0.0.1:8080 for host tools.
  base_url: http://llm:8080/v1
  model: qwen3.6-35b-a3b-q4_k_m   # Profile B (MoE); label only, llama-server serves the loaded gguf
  context_model: qwen3.5-4b-q4_k_m
  temperature: 0.0

chunking:
  max_article_tokens: 1000
  min_split_tokens: 120
  hard_max_tokens: 3000
  generate_context_sentences: false   # needs a real LLM backend

retrieval:
  dense_k: 50
  sparse_k: 50
  final_k: 8
  hydrate_refs: true
  hydrate_definitions: true
  cross_language: true
  # Absolute relevance floor — what makes the system abstain on an
  # out-of-corpus question instead of answering from the least-bad match.
  # These are on the embedding model's own scale. RE-TUNE THEM when you switch
  # embedding.backend to bge-m3: run `lawrag search` on a handful of questions
  # you know are answerable and a handful you know are not, and put the
  # threshold in the gap. Leaving the placeholder values in place with a real
  # model is a silent failure — either everything passes or nothing does.
  # min_dense_score is a cosine on the embedding model's scale — re-tune it when
  # you switch backend. min_lexical_score is a ts_rank_cd value (corpus- and
  # config-dependent, unrelated to the embedding model). min_trigram_score is a
  # word_similarity on 0..1, used only by the Kazakh fuzzy fallback.
  min_dense_score: 0.30
  min_lexical_score: 0.60
  min_trigram_score: 0.45

log_level: INFO
